    <script>
        function bootstrapHeader() {
            fetch('header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('header').innerHTML = data;
                    const authPromise = window.checkAuthStatus ? window.checkAuthStatus() : Promise.resolve();
                    return authPromise.then(() => {
                        setTimeout(function () {
                            if (window.jQuery && window.jQuery.fn && window.jQuery.fn.slicknav) {
                                window.jQuery('ul#navigation').slicknav({
                                    prependTo: '.mobile_menu',
                                    closedSymbol: '+',
                                    openedSymbol: '-'
                                });
                            }
                        }, 50);
                    });
                });
        }
        bootstrapHeader();
    </script>
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            });
    </script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const categoryId = params.get("category");
        const featuredType = params.get("type");
        const searchQuery = params.get("query");
        const searchLocation = params.get("location");

        if (featuredType) {
            loadServicesForFeaturedCategory(featuredType, searchQuery);
        } else if (categoryId) {
            const searchFilters = (searchQuery || searchLocation) ? { query: searchQuery || "", location: searchLocation || "" } : null;
            loadServices(categoryId, 1, 6, searchFilters);
            loadTotalListings(categoryId);
        } else {
            const searchFilters = (searchQuery || searchLocation) ? { query: searchQuery || "", location: searchLocation || "" } : null;
            loadServices("all", 1, 6, searchFilters);
        }
    </script>
